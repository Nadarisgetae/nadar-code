appId: dev.nadar.nadar-code
productName: Nadar Code
copyright: Copyright © 2026

asar: true

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - electron/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  icon: assets/icon.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nadar Code
